<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Web Flasher</title>
    <!-- Import the ESP Web Tools script component -->
    <script type="module" src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f5f5f5; }
        .card { padding: 2rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        esp-web-install-button { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Flash Your ESP Device</h2>
        <p>Connect your ESP board to your computer via USB and click below.</p>
        
        <!-- The button links directly to your manifest mapping -->
        <esp-web-install-button manifest="./manifest.json">
            <button slot="activate">Connect & Flash Device</button>
        </esp-web-install-button>
    </div>
</body>
</html>
